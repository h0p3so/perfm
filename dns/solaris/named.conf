options {
        directory "/etc/DNS";

        listen-on { 127.0.0.1; 192.168.2.11; };

        allow-query     { localhost; 192.168.2.0/24; };
        recursion yes;
        allow-recursion { localhost; 192.168.2.0/24; };

        dnssec-validation no;
};

zone "." IN {
        type hint;
        file "named.ca";
};

// ---- diego.com.it : this server is the PRIMARY ----
zone "diego.com.it" IN {
        type master;
        file "diego.com.it.hosts";
        allow-transfer { 192.168.2.9; };    // Slackware secondary
        also-notify    { 192.168.2.9; };
        notify yes;
};

// ---- miguel.org.uk : this server is a SECONDARY ----
zone "miguel.org.uk" IN {
        type slave;
        file "slaves/miguel.org.uk.hosts";
        masters { 192.168.2.9; };           // Slackware primary
        allow-transfer { none; };
};
