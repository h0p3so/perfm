options {
        directory "/etc/DNS";

        listen-on { 127.0.0.1; 192.168.2.9; };

        allow-query     { localhost; 192.168.2.0/24; };
        recursion yes;
        allow-recursion { localhost; 192.168.2.0/24; };

        // Disabled on purpose: our test zones are unsigned and the VM clock
        // is not yet synchronised (NTP comes later in this lab series).
        // Clock skew makes DNSSEC validation fail in confusing ways.
        dnssec-validation no;
};

// Root servers, for resolving domains we are not authoritative for.
zone "." IN {
        type hint;
        file "named.ca";
};

// ---- miguel.org.uk : this server is the PRIMARY ----
zone "miguel.org.uk" IN {
        type master;
        file "miguel.org.uk.hosts";
        allow-transfer { 192.168.2.11; };   // Solaris secondary
        also-notify    { 192.168.2.11; };
        notify yes;
};

// ---- diego.com.it : this server is a SECONDARY ----
zone "diego.com.it" IN {
        type slave;
        file "slaves/diego.com.it.hosts";
        masters { 192.168.2.11; };          // Solaris primary
        allow-transfer { none; };
};
